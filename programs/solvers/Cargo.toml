[package]
name = "solvers"
version = "0.1.0"
description = "Solvers: licenças, avaliações, créditos e garantia de agentes especialistas"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solvers"

[features]
# no-log-ix-name: tira o log "Instruction: X" de cada instrução (menos bytes e CU). Os testes identificam a
# instrução pelo discriminador, não pelo log.
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }
mpl-core = "0.12.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.17.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-program-pack = "3"
solana-account = "4"
solana-clock = "3"
